<path d="M600,720 L644,720" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<path d="M925,720 L969,720" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<path d="M1230,720 L1274,720" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<text x="750" y="842" font-size="14" font-weight="400" text-anchor="middle" fill="#4a5568" font-style="italic">Test split is touched once per model; the validation split steers early stopping and checkpoint choice.</text>
<text x="750" y="864" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568" font-style="italic">Numbers shown come from args.yaml, results.csv, yolo_compatibility.csv and annotation_audit.csv in this repository.</text>
</svg>