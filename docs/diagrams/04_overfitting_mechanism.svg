<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" width="1500" height="720" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Why a small dataset leads to overfitting and unreliable rankings</title><desc id="d">Causal chain from few independent photographs and a high-capacity pretrained detector to memorisation, noisy validation and wide test intervals, with the measured evidence from this project.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C53030"/></marker></defs>
<rect width="1500" height="720" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" text-anchor="start" fill="#1a202c">Mechanism of overfitting on this dataset, with measured evidence</text>
<rect x="40" y="80" width="400" height="112" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/>
<text x="240.0" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Few independent samples</text>
<text x="240.0" y="128.5" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">163 training photographs (489 files),</text>
<text x="240.0" y="147.0" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">677 boxes in 2 classes;</text>
<text x="240.0" y="165.5" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">Ultralytics advises ≥1,500 images/class</text>
<rect x="550" y="80" width="400" height="112" rx="10" fill="#FFF4E0" stroke="#B7791F" stroke-width="2"/>
<text x="750.0" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">High-capacity model</text>
<text x="750.0" y="128.5" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">9.3-11.2 M parameters,</text>
<text x="750.0" y="147.0" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">pretrained on COCO;</text>
<text x="750.0" y="165.5" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">online augmentation switched off</text>
<rect x="1060" y="80" width="400" height="112" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
<text x="1260.0" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Repeated exposure</text>
<text x="1260.0" y="128.5" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">the same pixels in every epoch;</text>
<text x="1260.0" y="147.0" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">3 near-identical copies of each scene;</text>
<text x="1260.0" y="165.5" font-size="13.5" font-weight="400" text-anchor="middle" fill="#4a5568">batch of 4 gives noisy updates</text>
<path d="M440,136 L546,136" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<path d="M950,136 L1056,136" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="255" width="400" height="112" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/>
<text x="240.0" y="279" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Memorisation</text>
<text x="240.0" y="303" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">train box loss, YOLOv8s: 1.47 → 0.11</text>
<text x="240.0" y="321" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">train box loss, YOLO12s: 1.52 → 0.11</text>
<text x="240.0" y="339" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">training loss falls on every curve</text>
<rect x="550" y="255" width="400" height="112" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/>
<text x="750.0" y="279" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Generalisation gap</text>
<text x="750.0" y="303" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">val box loss stays 1.0-1.3:</text>
<text x="750.0" y="321" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">YOLOv8s min 1.10 (epoch 12), last 1.31</text>
<text x="750.0" y="339" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">YOLO11s min 1.04 (22), last 1.46</text>
<rect x="1060" y="255" width="400" height="112" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/>
<text x="1260.0" y="279" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Early best epoch</text>
<text x="1260.0" y="303" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">best checkpoint comes early:</text>
<text x="1260.0" y="321" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">YOLO11s epoch 8 of 33,</text>
<text x="1260.0" y="339" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">YOLOv8s epoch 26 of 51</text>
<path d="M240,192 L240,251" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#ahr)"/>
<path d="M750,192 L750,251" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#ahr)"/>
<path d="M1260,192 L1260,251" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#ahr)"/>
<rect x="40" y="430" width="700" height="112" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/>
<text x="390.0" y="454" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Noisy validation signal (20 images, 27 boxes)</text>
<text x="390.0" y="478" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">val mAP@50:95 of YOLOv8s ranges 0.49-0.65 after the first 5 epochs;</text>
<text x="390.0" y="496" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">early stopping and best.pt rest on this curve, so the</text>
<text x="390.0" y="514" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">chosen checkpoint is partly selected by luck</text>
<rect x="800" y="430" width="660" height="112" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/>
<text x="1130.0" y="454" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Noisy test signal (21 images, 29 boxes)</text>
<text x="1130.0" y="478" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">95 % bootstrap CI of mAP@50:95: YOLOv8s 0.43-0.71,</text>
<text x="1130.0" y="496" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">YOLO11s 0.50-0.72, YOLO12s 0.63-0.81, YOLO26s 0.60-0.77;</text>
<text x="1130.0" y="514" font-size="13" font-weight="400" text-anchor="middle" fill="#4a5568">12s minus 26s = 0.035, CI -0.02 to +0.10</text>
<path d="M240,367 L240,426" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#ahr)"/>
<path d="M650,367 L650,426" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#ahr)"/>
<path d="M1260,367 L1260,426" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#ahr)"/>
<rect x="40" y="590" width="1420" height="100" rx="10" fill="#FFFFFF" stroke="#718096" stroke-width="2" stroke-dasharray="6 4"/>
<text x="750.0" y="614" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Consequence</text>
<text x="750.0" y="639" font-size="14" font-weight="400" text-anchor="middle" fill="#4a5568">High training accuracy does not show that the model has learned the defect; a ranking built on 29 test boxes is a hypothesis, not a result.</text>
<text x="750.0" y="658" font-size="14" font-weight="400" text-anchor="middle" fill="#4a5568">Fixes: more independent photographs, stronger online augmentation, k-fold or repeated runs, larger validation/test sets, frozen early layers.</text>
<path d="M390,542 L390,586" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#ahr)"/>
<path d="M1130,542 L1130,586" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#ahr)"/>
</svg>